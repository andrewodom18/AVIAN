[package]
name = "avian-network-helper"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[features]
default = ["server"]
server = ["dep:avian-storage", "dep:getrandom", "dep:tun", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ipnet = { version = "2", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["net", "fs", "process", "event"] }
socket2 = { version = "0.6", features = ["all"] }
avian-storage = { path = "../avian-storage", optional = true }
getrandom = { version = "0.3", optional = true }
tun = { version = "0.8.14", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"], optional = true }

[[bin]]
name = "avian-network-helper"
path = "src/main.rs"
required-features = ["server"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
