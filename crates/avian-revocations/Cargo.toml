[package]
name = "avian-revocations"
version.workspace = true
edition = "2024"

license-file.workspace = true

[dependencies]
avian-membership = { path = "../avian-membership" }
avian-engine = { path = "../avian-engine" }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = "2.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[lints]
workspace = true
