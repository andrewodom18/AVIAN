[package]
name = "avian"
version.workspace = true
license-file.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "aviand"
path = "src/bin/aviand.rs"

[[bin]]
name = "avianctl"
path = "src/bin/avianctl.rs"

[[bin]]
name = "avian-revocationd"
path = "src/bin/avian-revocationd.rs"

[dependencies]
avian-storage = { path = "../../crates/avian-storage" }
avian-services = { path = "../../crates/avian-services" }
avian-connectivity = { path = "../../crates/avian-connectivity" }
anyhow = "1"
avian-engine = { path = "../../crates/avian-engine" }
avian-membership = { path = "../../crates/avian-membership" }
avian-routing = { path = "../../crates/avian-routing" }
avian-revocations = { path = "../../crates/avian-revocations" }
avian-runtime = { path = "../../crates/avian-runtime" }
axum = { version = "0.8", features = ["json"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2.2"
fs2 = "0.4"
getrandom = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
