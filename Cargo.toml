[workspace]
resolver = "2"
members = [
    "apps/arc-radio-plugin",
    "apps/mesh-agent",
    "apps/mission-planner",
    "crates/mesh-core",
    "crates/mesh-peat",
    "crates/mesh-sim",
    "crates/vehicle-adapters",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
mavlink = { version = "=0.18.0", default-features = false, features = ["std", "dialect-common", "transport-tcp", "transport-udp"] }
peat-mesh = { version = "=0.9.0-rc.60", default-features = false, features = ["automerge-backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
